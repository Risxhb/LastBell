<!doctype html>

<body>
<canvas id="view"></canvas><div id="vig"></div>
<div id="tabs"><a href="?view=game">Game camera</a><a href="?view=angle">Angle view</a><a href="?view=top">Top view</a><a href="?view=game&tele">Telegraph check</a></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
// Area 1 — The Skyward Spire. Look mockup from the first panel of
// Reference/LAST-BELL-ARENA-ART-HANDOFF/artwork/a_wide_cinematic_concept_art_style_layout_poster.png:
// a round ivory dais with a gold compass medallion, sapphire inlays and a cobalt-paneled border; four bridges
// in a cross ending in gold gear landings; gothic ivory towers with cobalt glass and star banners; hanging
// columns and great gears under the dais; floating cathedrals and clouds in an open blue sky.
// One arena hosts 3 minibosses and the area boss, so the floor stays broad, flat and open; nothing tall stands
// inside the rim. Boss mechanics aren't designed yet: ?tele only draws a generic hostile circle and cone to
// check that the floor art stays quieter than warnings.
// ?view=game (gameplay camera, same as arena-look.html) | angle | top.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Q = new URLSearchParams(location.search), VIEW = Q.get('view') || 'game';
if (Q.has('clean')) document.body.classList.add('clean');
document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.search === location.search || (!location.search && a.search === '?view=game')));

const R = 14;          // dais floor radius (m); 8 players fit well outside a 7 m boss ring
const RIM = 14.8;      // outer edge of the curb and parapet
const BRIDGE_L = 13, BRIDGE_W = 4.6;
const TAU = Math.PI * 2;

// ---- helpers ----
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(11);
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
const fbm = (x, y) => vnoise(x, y) * 0.55 + vnoise(x * 2.1, y * 2.1) * 0.3 + vnoise(x * 4.3, y * 4.3) * 0.15;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const tex = (c, srgb = true) => { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
const canvas2d = (w, h = w) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
const loadScript = src => new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = res; document.head.appendChild(s); });
const nearBridge = (a, halfW, r) => { for (let k = 0; k < 4; k++) { let d = Math.abs(((a - k * Math.PI / 2) % TAU + TAU + Math.PI) % TAU - Math.PI); if (d * r < halfW) return true; } return false; };

// ---- floor painter ----
// Four layers painted together: colour, height (bump), ORM (green = roughness, blue = metalness) and a glow mask.
// Base: irregular cream flagstones (jittered Voronoi), a radial tile band and a cobalt-paneled border at the edge.
// On top: gold inlay drawn as vector strokes (a dark outline first, then the gold), sapphire enamel studs and the
// compass medallion. Gold is low-glow, so the floor stays below live warnings in brightness.
function paintFloor(N) {
  const S = N / (2 * R), C = 1.7;  // pixels per metre, flagstone cell size
  const [c, g] = canvas2d(N), [hc, hg] = canvas2d(N), [oc, og] = canvas2d(N), [ec, eg] = canvas2d(N);
  const img = g.createImageData(N, N), d = img.data, himg = hg.createImageData(N, N), hd = himg.data, oimg = og.createImageData(N, N), od = oimg.data;
  const jit = (i, j) => [i + 0.15 + 0.7 * hash(i * 1.7, j * 3.1), j + 0.15 + 0.7 * hash(i * 5.3, j * 0.7)];
  for (let py = 0; py < N; py++) for (let px = 0; px < N; px++) {
    const x = (px + 0.5) / S - R, z = (py + 0.5) / S - R, r = Math.hypot(x, z), a = Math.atan2(z, x), o = (py * N + px) * 4;
    const n = fbm(x * 0.3, z * 0.3), fine = vnoise(x * 5, z * 5);
    let cr, cg, cb, h = 0.75, rough = 205, metal = 0, edge, sid;
    if (r < 11.5) {                                                  // irregular flagstones
      const gx = x / C, gz = z / C, ix = Math.floor(gx), iz = Math.floor(gz); let d1 = 9, d2 = 9, best = 0;
      for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) { const [qx, qz] = jit(ix + i, iz + j), dd = (gx - qx) ** 2 + (gz - qz) ** 2;
        if (dd < d1) { d2 = d1; d1 = dd; best = (ix + i) * 131 + (iz + j); } else if (dd < d2) d2 = dd; }
      edge = (Math.sqrt(d2) - Math.sqrt(d1)) * C * 0.5; sid = hash(best, 7.7);
    } else if (r < 12.7) {                                           // radial tile band
      const sec = 72, sa = (a / TAU + 1) * sec, fs = sa - Math.floor(sa), arc = r * TAU / sec;
      edge = Math.min(fs * arc, (1 - fs) * arc, r - 11.5, 12.7 - r); sid = hash(Math.floor(sa), 3.3);
    } else if (r < 13.55) {                                          // cobalt panel border
      const sec = 40, sa = (a / TAU + 1) * sec, fs = sa - Math.floor(sa), arc = r * TAU / sec;
      edge = Math.min(fs * arc, (1 - fs) * arc, r - 12.7, 13.55 - r); sid = -1;
    } else { const sec = 96, sa = (a / TAU + 1) * sec, fs = sa - Math.floor(sa), arc = r * TAU / sec; edge = Math.min(fs * arc, (1 - fs) * arc, r - 13.55, R - r); sid = hash(Math.floor(sa), 9.1); }
    if (sid >= 0) {
      const warm = hash(sid * 9, 2), v = (sid - 0.5) * 0.09 + (n - 0.5) * 0.14 + (fine - 0.5) * 0.04;
      cr = (236 + warm * 8) * (1 + v); cg = (226 + warm * 2) * (1 + v); cb = (204 - warm * 14) * (1 + v);
      const sun = 1 + (n - 0.5) * 0.06;                               // soft painterly light drift
      cr *= sun; cg *= sun; cb *= sun;
      if (edge < 0.12) { const t = 1 - smooth(0.025, 0.12, edge), f = 1 - t * 0.06; cr *= f; cg *= f; cb *= f * 1.01; h = 0.75 - t * 0.2; }
      if (edge < 0.025) { cr = 200; cg = 188; cb = 166; h = 0.4; }
      if (fine > 0.9) { cr *= 0.97; cg *= 0.96; cb *= 0.95; }
    } else {                                                         // cobalt enamel panel
      const v = (n - 0.5) * 0.12, t = smooth(0.0, 0.25, edge);
      cr = (44 + 30 * t) * (1 + v); cg = (72 + 34 * t) * (1 + v); cb = (150 + 30 * t) * (1 + v); rough = 90; h = 0.7;
      if (edge < 0.06) { cr = 200; cg = 150; cb = 70; metal = 230; rough = 95; h = 0.95; }   // gold frame
    }
    d[o] = Math.min(255, cr); d[o + 1] = Math.min(255, cg); d[o + 2] = Math.min(255, cb); d[o + 3] = 255;
    const hv = Math.max(0, Math.min(255, h * 255)); hd[o] = hd[o + 1] = hd[o + 2] = hv; hd[o + 3] = 255;
    od[o] = 255; od[o + 1] = rough; od[o + 2] = metal; od[o + 3] = 255;
  }
  g.putImageData(img, 0, 0); hg.putImageData(himg, 0, 0); og.putImageData(oimg, 0, 0);
  eg.fillStyle = '#000'; eg.fillRect(0, 0, N, N);
  const L = [g, hg, og, eg];
  L.forEach(ctx => { ctx.save(); ctx.translate(N / 2, N / 2); ctx.scale(S, S); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; });

  // gold(fn, width, fill) and blue(fn): fn(ctx) builds a path in metres; gold is metal inlay, blue is enamel.
  const GOLD = '#e3ae4e', GOLD_DK = '#9a6a2a', GOLD_LT = '#fbe2a0';
  function gold(fn, w, fill = false) {
    const st = (ctx, col, ww) => { ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = ww; fn(ctx); fill ? ctx.fill() : ctx.stroke(); if (fill && ww) ctx.stroke(); };
    st(g, GOLD_DK, w + 0.022); st(g, GOLD, w); if (!fill) st(g, GOLD_LT, w * 0.3);
    st(hg, '#fff', w + 0.02); st(og, 'rgb(255,95,150)', w + 0.02); st(eg, '#5a4220', w);
  }
  function blue(fn, glow = 0) {
    g.fillStyle = '#2d4fa6'; fn(g); g.fill(); g.strokeStyle = GOLD_DK; g.lineWidth = 0.05; g.stroke();
    hg.fillStyle = '#d0d0d0'; fn(hg); hg.fill(); og.fillStyle = 'rgb(255,70,30)'; fn(og); og.fill();
    if (glow) { eg.fillStyle = `rgba(120,190,255,${glow})`; fn(eg); eg.fill(); }
  }
  const circ = (x, y, r) => ctx => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); };
  const arc = (x, y, r, a0, a1) => ctx => { ctx.beginPath(); ctx.arc(x, y, r, a0, a1); };
  const seg = (x0, y0, x1, y1) => ctx => { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); };
  const poly = pts => ctx => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); };
  const P = (r, a) => [Math.cos(a) * r, Math.sin(a) * r];
  const star = (r0, r1, n, rot = 0) => { const p = []; for (let i = 0; i < n * 2; i++) p.push(P(i % 2 ? r0 : r1, rot + i / (n * 2) * TAU)); return poly(p); };

  // compass medallion: a beige field inside heavy gold rings, star points, scrollwork, a sapphire heart
  gold(ctx => { ctx.beginPath(); ctx.arc(0, 0, 5.8, 0, TAU); ctx.arc(0, 0, 5.25, 0, TAU, true); }, 0.02, true);   // solid outer band
  g.strokeStyle = GOLD_DK; g.lineWidth = 0.025;
  for (let i = 0; i < 96; i++) { const a = i / 96 * TAU; g.beginPath(); g.moveTo(...P(5.3, a)); g.lineTo(...P(i % 4 ? 5.45 : 5.62, a)); g.stroke(); }
  for (let i = 0; i < 24; i++) { const a = (i + 0.5) / 24 * TAU; blue(circ(...P(5.66, a), 0.06)); }
  for (const [r, w] of [[5.1, 0.06], [4.35, 0.16], [2.2, 0.12], [1.42, 0.18]]) gold(circ(0, 0, r), w);
  for (let i = 0; i < 72; i++) { const a = i / 72 * TAU, big = i % 6 === 0; gold(seg(...P(5.1, a), ...P(big ? 4.7 : 4.92, a)), big ? 0.07 : 0.035); }
  for (let i = 0; i < 12; i++) { const a = i / 12 * TAU + TAU / 24; gold(arc(...P(4.85, a), 0.32, a + Math.PI * 0.55, a + Math.PI * 1.45), 0.05); gold(circ(...P(4.62, a), 0.06), 0.02, true); }
  g.fillStyle = 'rgba(214,170,92,0.35)'; star(0.85, 3.0, 4, -Math.PI / 4)(g); g.fill();   // pale-gold diagonal points
  gold(star(0.85, 3.0, 4, -Math.PI / 4), 0.07);
  gold(star(0.95, 4.25, 4, -Math.PI / 2), 0.04, true);              // solid long cardinal points
  for (let i = 0; i < 4; i++) { const a = i / 4 * TAU - Math.PI / 2; g.fillStyle = 'rgba(120,80,30,0.35)'; poly([[0, 0], P(4.25, a), P(0.95, a + Math.PI / 4)])(g); g.fill(); }  // shaded half of each point
  for (let i = 0; i < 4; i++) { const a = i / 4 * TAU - Math.PI / 2; gold(seg(0, 0, ...P(4.2, a)), 0.035); gold(seg(0, 0, ...P(2.95, a + Math.PI / 4)), 0.03); }
  for (let i = 0; i < 8; i++) {                                     // scrollwork curls between the points
    const a = i / 8 * TAU - Math.PI / 2 + TAU / 16;
    for (const s of [-1, 1]) gold(ctx => { ctx.beginPath(); const [x0, y0] = P(2.35, a + s * 0.05), [x1, y1] = P(3.3, a + s * 0.28), [x2, y2] = P(3.85, a + s * 0.12), [x3, y3] = P(3.55, a + s * 0.02);
      ctx.moveTo(x0, y0); ctx.bezierCurveTo(x1, y1, x2, y2, x3, y3); }, 0.045);
    gold(circ(...P(3.62, a), 0.11), 0.03); blue(circ(...P(3.62, a), 0.09));
  }
  blue(circ(0, 0, 1.36), 0.15);
  gold(star(0.22, 1.12, 8, -Math.PI / 2), 0.03, true);
  g.fillStyle = '#cfefff'; circ(0, 0, 0.22)(g); g.fill(); eg.fillStyle = '#bfe6ff'; circ(0, 0, 0.3)(eg); eg.fill();

  // field: thin ring, eight spokes with enamel lozenges, four round star emblems, scattered sapphire studs
  gold(circ(0, 0, 7.3), 0.07); gold(circ(0, 0, 11.5), 0.16); gold(circ(0, 0, 12.7), 0.12); gold(circ(0, 0, 13.55), 0.1); gold(circ(0, 0, R - 0.04), 0.1);
  for (let i = 0; i < 24; i++) { const a = i / 24 * TAU; gold(arc(...P(7.62, a), 0.3, a + Math.PI * 0.6, a + Math.PI * 1.4), 0.04); }
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU;
    gold(seg(...P(5.88, a), ...P(8.3, a)), 0.05); gold(seg(...P(9.1, a), ...P(11.4, a)), 0.05);
    const loz = [P(9.2, a), P(8.7, a + 0.045), P(8.2, a), P(8.7, a - 0.045)]; blue(poly(loz)); gold(poly(loz), 0.05);
  }
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * TAU + Math.PI / 4, [x, y] = P(9.9, a);
    gold(circ(x, y, 0.78), 0.1); blue(circ(x, y, 0.7), 0.08); gold(star(0.12, 0.55, 4, a), 0.02, true);
    gold(circ(x, y, 0.95), 0.03);
  }
  const studs = [];
  for (let k = 0; k < 400 && studs.length < 34; k++) {
    const r = 6.1 + rnd() * 5.1, a = rnd() * TAU, [x, y] = P(r, a);
    if (Math.abs(r - 7.3) < 0.6 || studs.some(([u, v]) => Math.hypot(u - x, v - y) < 1.6) || [0, 1, 2, 3].some(i => Math.hypot(...P(9.9, i / 4 * TAU + Math.PI / 4).map((q, j) => q - [x, y][j])) < 1.4)) continue;
    studs.push([x, y]);
    if (rnd() < 0.5) { blue(circ(x, y, 0.13)); gold(circ(x, y, 0.15), 0.03); }
    else { const b = rnd() * TAU, q = [[x + Math.cos(b) * 0.24, y + Math.sin(b) * 0.24], [x - Math.sin(b) * 0.12, y + Math.cos(b) * 0.12], [x - Math.cos(b) * 0.24, y - Math.sin(b) * 0.24], [x + Math.sin(b) * 0.12, y - Math.cos(b) * 0.12]]; blue(poly(q)); gold(poly(q), 0.03); }
  }
  for (let i = 0; i < 40; i++) { const a = (i + 0.5) / 40 * TAU, [x, y] = P(13.12, a); gold(ctx => { ctx.beginPath(); for (let j = 0; j < 8; j++) { const [u, v] = P(j % 2 ? 0.06 : 0.22, a + j / 8 * TAU); ctx.lineTo(x + u, y + v); } ctx.closePath(); }, 0.01, true); }
  for (let i = 0; i < 96; i++) { const a = i / 96 * TAU; gold(circ(...P(13.78, a + TAU / 192), 0.045), 0.01, true); }
  L.forEach(ctx => ctx.restore());
  return { map: tex(c), bump: tex(hc, false), orm: tex(oc, false), glow: tex(ec) };
}

// ---- banner and stone textures ----
function paintBanner(w = 256, h = 1024) {
  const [c, g] = canvas2d(w, h), tail = h * 0.86;
  const grd = g.createLinearGradient(0, 0, w, 0); grd.addColorStop(0, '#163283'); grd.addColorStop(0.5, '#2448b0'); grd.addColorStop(1, '#163283');
  const shape = () => { g.beginPath(); g.moveTo(0, 0); g.lineTo(w, 0); g.lineTo(w, h); g.lineTo(w / 2, tail); g.lineTo(0, h); g.closePath(); };
  g.fillStyle = grd; shape(); g.fill();
  for (let i = 0; i < 9; i++) { g.fillStyle = `rgba(0,0,30,${0.05 + (i % 2) * 0.06})`; g.fillRect(i * w / 9, 0, w / 18, h); }   // cloth folds
  g.strokeStyle = '#e4b865'; g.lineWidth = 10; shape(); g.stroke();
  g.lineWidth = 3; g.beginPath(); g.moveTo(18, 40); g.lineTo(18, h - 60); g.moveTo(w - 18, 40); g.lineTo(w - 18, h - 60); g.stroke();
  g.fillStyle = '#e4b865'; g.fillRect(0, 0, w, 34); g.fillStyle = '#8a5d22'; for (let i = 0; i < 8; i++) g.fillRect(i * w / 8 + 10, 12, w / 16, 10);
  const emblem = (cy, s) => {
    g.save(); g.translate(w / 2, cy); g.scale(s, s); g.strokeStyle = g.fillStyle = '#ecc06c';
    g.lineWidth = 6; g.beginPath(); g.arc(0, 0, 84, 0, TAU); g.stroke(); g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 70, 0, TAU); g.stroke();
    for (let i = 0; i < 16; i++) { const a = i / 16 * TAU; g.lineWidth = i % 2 ? 2 : 4; g.beginPath(); g.moveTo(Math.cos(a) * 26, Math.sin(a) * 26); g.lineTo(Math.cos(a) * (i % 2 ? 60 : 100), Math.sin(a) * (i % 2 ? 60 : 100)); g.stroke(); }
    g.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * TAU - Math.PI / 2, rr = i % 2 ? 14 : 56; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.closePath(); g.fill();
    g.restore();
  };
  emblem(h * 0.3, 0.95); emblem(h * 0.62, 0.5);
  g.fillStyle = '#e4b865'; for (let i = 0; i < 7; i++) { g.beginPath(); g.arc(w * (i + 0.5) / 7, h * 0.46, 4, 0, TAU); g.fill(); }
  return tex(c);
}
function paintCloud(N = 256) {
  const [c, g] = canvas2d(N);
  for (let i = 0; i < 34; i++) {
    const x = N * (0.18 + rnd() * 0.64), y = N * (0.3 + rnd() * 0.36), rr = N * (0.08 + rnd() * 0.16);
    const grd = g.createRadialGradient(x, y - rr * 0.3, 0, x, y, rr); grd.addColorStop(0, 'rgba(255,255,255,0.7)'); grd.addColorStop(0.6, 'rgba(236,242,255,0.45)'); grd.addColorStop(1, 'rgba(214,226,250,0)');
    g.fillStyle = grd; g.fillRect(0, 0, N, N);
  }
  return tex(c);
}
function paintBlocks(w = 512, h = 512, rows = 8, base = [240, 228, 202]) {   // ashlar blocks for walls and towers
  const [c, g] = canvas2d(w, h); g.fillStyle = `rgb(${base})`; g.fillRect(0, 0, w, h);
  const rh = h / rows;
  for (let r = 0; r < rows; r++) { let x = (r % 2) * -40; while (x < w) { const bw = 60 + hash(x, r) * 70, v = (hash(r, x) - 0.5) * 18;
    g.fillStyle = `rgb(${base[0] + v},${base[1] + v},${base[2] + v - 2})`; g.fillRect(x + 2, r * rh + 2, bw - 4, rh - 4); x += bw; } }
  g.fillStyle = 'rgba(120,100,80,0.35)'; for (let r = 0; r <= rows; r++) g.fillRect(0, r * rh - 1, w, 2);
  const t = tex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

// ---- renderer, scene, sky ----
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('view'), antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, 1, 0.1, 1400);
window.THREE = THREE;

// The sun sits high at the front left so the tall back towers throw their shadows away from the floor.
const SUN = new THREE.Vector3(-0.42, 0.85, 0.32).normalize();
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { sun: { value: SUN } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',

    add(new THREE.BoxGeometry(1.3, 0.16, 1.3), goldM, br, [px, 3.4, pz]);
    add(archGeo(0.45, 1.4), glassM, br, [px + 0.56, 1.3, pz], [0, Math.PI / 2, 0], false);
    add(archGeo(0.6, 1.55, 0.03), goldM, br, [px + 0.55, 1.22, pz], [0, Math.PI / 2, 0], false);
    pinnacle(br, px, 3.45, pz, 1.2, 0.7);
    if (k !== 1) banner(br, [px + 0.62, 3.0, pz], Math.PI / 2, 0.9, 2.8);
  }
  if (k !== 1) {
    const gate = add(new THREE.TorusGeometry(hw + 0.55, 0.22, 8, 32, Math.PI), ivoryPlainM, br, [RIM + 0.4, 3.4, 0], [0, Math.PI / 2, 0]);
    add(new THREE.TorusGeometry(hw + 0.55, 0.08, 6, 32, Math.PI), goldM, br, [RIM + 0.55, 3.4, 0], [0, Math.PI / 2, 0]);
    add(new THREE.OctahedronGeometry(0.35), goldM, br, [RIM + 0.4, 3.4 + hw + 0.75, 0]);
  }
  // landing: a round ivory drum topped with a great gold gear, a gate tower behind it
  const land = new THREE.Group(); land.position.set(x1 + 2.6, 0, 0); br.add(land);
  add(new THREE.CylinderGeometry(3.2, 2.6, 1.4, 48), ivoryM, land, [0, -0.7, 0]);
  add(new THREE.CylinderGeometry(3.25, 3.25, 0.3, 48), cobaltM, land, [0, -1.45, 0]);
  add(new THREE.CircleGeometry(3.2, 48), ivoryPlainM, land, [0, 0.01, 0], [-Math.PI / 2, 0, 0]);
  const lg = gear(2.9, 24, 0.3, 8); lg.rotation.x = Math.PI / 2; lg.position.y = 0.12; land.add(lg); spin.push([lg, 'z', 0.1 * (k % 2 ? 1 : -1)]);
  gothicTower(land, 1.6, 0, 0, { h: k === 1 ? 6 : 11, w: 1.6, tiers: 2, spire: k === 1 ? 0 : 1 });
  hangingColumn(land, 0, -1.6, 0, 3.5, 1.2);
}

// ---- towers ringing the dais (all outside the rim) ----
// Back two are the tallest; the side pair are mid height; the camera-side pair stay short with domes so the
// gameplay camera never loses floor. Each stands on a buttressed plinth tied back to the drum.
const RING = [[-135, 30, 3.6, 4, 2], [-45, 30, 3.6, 4, 2], [-100, 22, 2.6, 3, 1], [170, 12, 2.4, 2, 1], [10, 12, 2.4, 2, 1], [45, 7, 2.4, 2, 0], [135, 7, 2.4, 2, 0]];
for (const [deg, h, w, tiersN, nb] of RING) {
  if (!h) continue;
  const a = deg * Math.PI / 180, d = RIM + w * 0.75 + (Math.sin(a) > -0.5 ? 2.6 : 1.2), x = Math.cos(a) * d, z = Math.sin(a) * d;
  add(new THREE.CylinderGeometry(w * 0.9, w * 0.5, 7, 8), ivoryDarkM, root, [x, -3.5, z]);
  add(new THREE.TorusGeometry(w * 0.9, 0.12, 6, 32), goldM, root, [x, 0, z], [Math.PI / 2, 0, 0]);
  hangingColumn(root, x, -7, z, 5, w * 0.35);
  const brace = add(new THREE.BoxGeometry(2.8, 0.6, w * 0.8), ivoryPlainM, root, [Math.cos(a) * (RIM + 0.8), -0.3, Math.sin(a) * (RIM + 0.8)], [0, -a, 0]);
  gothicTower(root, x, 0, z, { h, w, tiers: tiersN, banners: nb, face: Math.PI / 2 - a - Math.PI, spire: h > 10 ? 1 : 0 });
}

// ---- mid-distance spires rising out of the clouds on their own rocks ----
const MID = [[-160, 44, -6, 34], [-128, 52, -10, 42], [-105, 40, -4, 30], [-72, 48, -8, 46], [-48, 42, -3, 32], [-20, 50, -10, 38], [195, 50, -12, 30]];
for (const [deg, dist, y, h] of MID) {
  const a = deg * Math.PI / 180, x = Math.cos(a) * dist, z = Math.sin(a) * dist, w = 2.4 + rnd() * 1.4;
  const base = new THREE.Group(); base.position.set(x, y, z); root.add(base); bob.push([base, rnd() * 6, y]);
  add(new THREE.CylinderGeometry(w * 1.8, w * 1.4, 2.2, 10), ivoryDarkM, base, [0, -1.1, 0]);
  add(new THREE.ConeGeometry(w * 1.5, w * 5, 9), ivoryDarkM, base, [0, -2.2 - w * 2.5, 0], [Math.PI, 0, 0]);
  add(new THREE.TorusGeometry(w * 1.8, 0.15, 6, 32), goldM, base, [0, 0, 0], [Math.PI / 2, 0, 0]);
  gothicTower(base, 0, 0, 0, { h, w, tiers: 4, banners: 2, face: Math.PI / 2 - a - Math.PI, detail: 1 });
  for (const s of [-1, 1]) gothicTower(base, s * w * 1.25, 0, w * 0.4, { h: h * 0.45, w: w * 0.55, tiers: 2, spire: 1, detail: 0 });
}

// ---- far skyline: floating cathedral islands and upside-down towers ----
const far = new THREE.Group(); far.name = 'Skyline'; scene.add(far);
const ISLANDS = [[-150, 130, 0], [-112, 110, 10], [-80, 150, -8], [-40, 120, 14], [-10, 160, -4], [-195, 120, -16], [165, 135, -4], [130, 115, 8], [200, 150, -20], [35, 150, -12], [70, 125, 20], [-60, 200, 30], [-130, 190, 26], [10, 210, 30]];
for (const [deg, dist, y] of ISLANDS) {
  const a = deg * Math.PI / 180, s = 0.9 + rnd() * 0.9;
  const isl = new THREE.Group(); isl.position.set(Math.cos(a) * dist, y, Math.sin(a) * dist); isl.scale.setScalar(s); far.add(isl); bob.push([isl, rnd() * 6, y]);
  add(new THREE.CylinderGeometry(9, 8, 2.5, 12), ivoryDarkM, isl, [0, -1.2, 0], null, false);
  add(new THREE.ConeGeometry(8, 16, 10), ivoryDarkM, isl, [0, -10.5, 0], [Math.PI, 0, 0], false);
  const n = 3 + Math.floor(rnd() * 4);
  for (let i = 0; i < n; i++) { const b = rnd() * TAU, rr = i ? 3 + rnd() * 4.5 : 0; gothicTower(isl, Math.cos(b) * rr, 0, Math.sin(b) * rr, { h: i ? 9 + rnd() * 12 : 26 + rnd() * 16, w: i ? 1.6 : 3.2, tiers: i ? 2 : 4, spire: rnd() < 0.75 ? 1 : 0, detail: 0, banners: i ? 0 : 1, face: rnd() * TAU }); }
  for (let i = 0; i < 3; i++) { const b = rnd() * TAU; hangingColumn(isl, Math.cos(b) * 4, -3, Math.sin(b) * 4, 6 + rnd() * 6, 1); }
}
for (let i = 0; i < 10; i++) {                                         // loose upside-down towers drifting in the sky
  const a = rnd() * TAU, d = 70 + rnd() * 120, y = 20 + rnd() * 40, g = new THREE.Group();
  g.position.set(Math.cos(a) * d, y, Math.sin(a) * d); g.rotation.z = Math.PI; far.add(g); bob.push([g, rnd() * 6, y]);
  gothicTower(g, 0, 0, 0, { h: 10 + rnd() * 10, w: 2, tiers: 2, detail: 0 });
}

// ---- clouds: deep banks below, puffs around the tower bases, wisps in the far sky ----
const cloudTex = paintCloud(), cloudTex2 = paintCloud();
const clouds = [];
function puff(a, d, y, s, op) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: rnd() < 0.5 ? cloudTex : cloudTex2, color: 0xffffff, transparent: true, opacity: op, depthWrite: false, fog: true }));
  sp.position.set(Math.cos(a) * d, y, Math.sin(a) * d); sp.scale.set(s, s * 0.55, 1); scene.add(sp); clouds.push([sp, a, d, 0.003 + rnd() * 0.005]);
}
for (let i = 0; i < 95; i++) puff(rnd() * TAU, 30 + rnd() * 260, -26 - rnd() * 34, 30 + rnd() * 60, 0.6 + rnd() * 0.3);
for (let i = 0; i < 36; i++) puff(rnd() * TAU, 36 + rnd() * 30, -14 - rnd() * 10, 14 + rnd() * 18, 0.7);
for (let i = 0; i < 50; i++) puff(rnd() * TAU, 180 + rnd() * 200, 10 + rnd() * 90, 50 + rnd() * 80, 0.6);
const [sc, sg] = canvas2d(512), sgrd = sg.createRadialGradient(256, 256, 0, 256, 256, 256);
sgrd.addColorStop(0, '#5d8ddf'); sgrd.addColorStop(0.55, '#86aeea'); sgrd.addColorStop(1, '#cfe0f8'); sg.fillStyle = sgrd; sg.fillRect(0, 0, 512, 512);
add(new THREE.CircleGeometry(900, 48), new THREE.MeshBasicMaterial({ map: tex(sc), fog: false }), scene, [0, -80, 0], [-Math.PI / 2, 0, 0], false);

// ---- generic warning shapes (?tele): not a boss mechanic, only a readability check against the floor ----
if (Q.has('tele')) {
  // On a bright floor an additive-looking coral wash vanishes, so the fill is a deeper red-orange and every
  // shape gets a dark outer rim (the contrast comes from value, not just hue). Colours are linear: the output pass converts.
  const teleShader = (shape) => new THREE.ShaderMaterial({ transparent: true, depthWrite: false, toneMapped: false, uniforms: { t: { value: 0 } },
    vertexShader: 'varying vec2 vU; void main(){ vU = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
    fragmentShader: `varying vec2 vU; uniform float t; void main(){ vec2 p = vU * 2. - 1.; float r = length(p), a = atan(p.y, p.x);
      float hw = ${shape === 'cone' ? '0.5236' : '3.2'}; float da = abs(a);
      if (r > 1. || da > hw) discard;
      float edge = min(1. - r, ${shape === 'cone' ? '(hw - da) * r' : '1.'});
      float rim = 1. - smoothstep(0.035, 0.07, edge), dark = 1. - smoothstep(0.0, 0.025, edge);
      float stripe = step(0.5, fract((p.x - p.y) * 5. - t * 0.8)) * 0.1, pulse = 0.58 + 0.08 * sin(t * 6.);
      vec3 col = mix(vec3(0.69, 0.035, 0.008), vec3(1.0, 0.26, 0.05), rim);
      col = mix(col, vec3(0.09, 0.004, 0.002), dark);
      gl_FragColor = vec4(col, max(max(rim, dark) * 0.95, pulse + stripe)); }` });
  const teleC = teleShader('circle'), teleK = teleShader('cone');
  add(new THREE.PlaneGeometry(9, 9), teleC, root, [-5.5, 0.03, -4], [-Math.PI / 2, 0, 0], false);
  add(new THREE.PlaneGeometry(16, 16), teleK, root, [2, 0.03, 0], [-Math.PI / 2, 0, -Math.PI / 5], false);
  window.__tele = [teleC, teleK];
}

// ---- the Vanguard for scale (characters session's model, loaded read-only) ----
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: o.metal ? 0.4 : 0.75, metalness: o.metal ? 0.7 : 0, side: o.side || THREE.FrontSide });
const Gl = (c, k) => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), toneMapped: false });
const hero = new THREE.Group(); hero.position.set(-3.5, 0, 6.5); hero.rotation.y = Math.PI * 0.8; scene.add(hero);
await loadScript('../../vanguard-model.js');
if (typeof window.buildVanguardModel === 'function') { const v = window.buildVanguardModel(M, Gl); const obj = v.root || v; obj.scale.setScalar(1.2); obj.traverse(o => { if (o.isMesh) o.castShadow = true; }); hero.add(obj); }
else add(new THREE.CapsuleGeometry(0.35, 1, 4, 12), M(0x2050cc), hero, [0, 0.85, 0]);

// ---- post ----
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.28, 0.4, 0.95));
composer.addPass(new OutputPass());

function frame() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h;
  if (VIEW === 'top') { camera.fov = 36; camera.position.set(0, 110, 0.01); camera.lookAt(0, 0, 0); }
  else if (VIEW === 'angle') { camera.fov = 42; camera.position.set(-30, 30, 44); camera.lookAt(0, -2, -3); }
  else { camera.fov = 44; camera.position.set(0, 29, 22.5); camera.lookAt(0, 0, 1.0); }
  camera.updateProjectionMatrix();
}
addEventListener('resize', frame); frame();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (renderer.domElement.width !== Math.floor(innerWidth * renderer.getPixelRatio())) frame();   // headless capture resizes late
  for (const [o, ax, s] of spin) o.rotation[ax] += s * dt;
  for (const [o, ph, y0] of bob) o.position.y = y0 + Math.sin(t * 0.35 + ph) * 0.6;
  for (const [b, ph] of sway) b.rotation.x = Math.sin(t * 1.1 + ph) * 0.05;
  for (const c of clouds) { c[1] += c[3] * dt; c[0].position.x = Math.cos(c[1]) * c[2]; c[0].position.z = Math.sin(c[1]) * c[2]; }
  if (window.__tele) for (const m of window.__tele) m.uniforms.t.value = t;
  composer.render();
});
window.__ready = true;
</script>
</body>
</html>
