<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verdant Chimes Look</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d3036; }
canvas { display: block; }
#vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, #04161a99 100%); }
#tabs { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; font-family: Georgia, serif; }
#tabs a { padding: 7px 14px; font-size: 15px; color: #e6f3ea; text-decoration: none; background: #0b1c1ce0; border: 1px solid #5fd8c888; border-radius: 8px; }
#tabs a.on { background: #5fd8c8; color: #0b1c1c; }
body.clean #tabs { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas><div id="vig"></div>
<div id="tabs"><a href="?view=game">Game camera</a><a href="?view=angle">Angle view</a><a href="?view=top">Top view</a></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
// Look study for Area 3, The Verdant Chimes (verdant-env.js). ?view=game uses the gameplay camera from arena-look.html;
// ?view=angle and ?view=top match the board's angle and top studies. ?quiet dims decoration as during a telegraph,
// ?rings draws the playable edge, ?clean hides the tabs, ?nohero drops the Vanguard used for scale.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const Q = new URLSearchParams(location.search), VIEW = Q.get('view') || 'game';
if (Q.has('clean')) document.body.classList.add('clean');
document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.search === `?view=${VIEW}`));
const loadScript = src => new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = res; document.head.appendChild(s); });

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('view'), antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, 1, 0.1, 900);
await loadScript('verdant-env.js');
const env = window.buildVerdantEnv(THREE, scene);

if (Q.has('rings')) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(env.PLAY_R - 0.06, env.PLAY_R, 128).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }));
  ring.position.y = 0.03; scene.add(ring);
}

// ---- the Vanguard for scale (characters session's model, loaded read-only) ----
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: o.metal ? 0.4 : 0.75, metalness: o.metal ? 0.7 : 0, side: o.side || THREE.FrontSide });
const Gl = (c, k) => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), toneMapped: false });
if (!Q.has('nohero')) {
  window.THREE = THREE;
  const hero = new THREE.Group(); hero.position.set(-3.5, 0, 5); hero.rotation.y = Math.PI * 0.8; scene.add(hero);
  await loadScript('../../vanguard-model.js');
  if (typeof window.buildVanguardModel === 'function') { const v = window.buildVanguardModel(M, Gl); const obj = v.root || v; obj.scale.setScalar(1.2); obj.traverse(o => { if (o.isMesh) o.castShadow = true; }); hero.add(obj); }
  else { const c = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 1, 4, 12), M(0x2050cc)); c.position.y = 0.85; hero.add(c); }
}

// ---- frame, after the Windblown teardown (research/windblown-artstyle.html §3, §7): MSAA scene -> depth/normal
// outlines on lit surfaces only -> bloom -> tonemap -> a light grade (teal shadows, warm highlights). The look is made
// in the lighting (verdant-env.js LOOK); post only finishes it. Same chain as ../../mockup.html.
if (env.sun) { env.sun.shadow.mapSize.set(4096, 4096); }
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, { samples: 4, type: THREE.HalfFloatType }));
composer.addPass(new RenderPass(scene, camera));
const normalTarget = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { depthTexture: new THREE.DepthTexture(innerWidth, innerHeight), type: THREE.HalfFloatType });
const normalMat = new THREE.MeshNormalMaterial();
const outlinePass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, tNormal: { value: null }, tDepth: { value: null }, res: { value: new THREE.Vector2(1, 1) }, near: { value: 0.1 }, far: { value: 900 }, ink: { value: new THREE.Color(0x0c2422) }, thick: { value: 1.0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse, tNormal, tDepth; uniform vec2 res; uniform float near, far, thick; uniform vec3 ink; varying vec2 vUv;
    float lin(vec2 uv){ float z = texture2D(tDepth, uv).x * 2. - 1.; return 2. * near * far / (far + near - z * (far - near)); }
    vec3 nrm(vec2 uv){ return texture2D(tNormal, uv).xyz * 2. - 1.; }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv); vec2 px = thick / res;
      float D = lin(vUv); vec3 N = nrm(vUv); float dd = 0., nd = 0.;
      vec2 o[4]; o[0] = vec2(px.x, 0.); o[1] = vec2(-px.x, 0.); o[2] = vec2(0., px.y); o[3] = vec2(0., -px.y);
      for (int i = 0; i < 4; i++) { dd = max(dd, abs(lin(vUv + o[i]) - D)); nd = max(nd, 1. - dot(N, nrm(vUv + o[i]))); }
      float eD = smoothstep(0.03 * D, 0.06 * D, dd), eN = smoothstep(0.25, 0.55, nd) * step(0.01, length(N));
      float e = max(eD, eN) * (1. - smoothstep(40., 110., D));
      gl_FragColor = vec4(mix(c.rgb, ink * 0.6 + c.rgb * 0.3, e * 0.7), c.a);
    }`,
});
composer.addPass(outlinePass);
outlinePass.uniforms.tNormal.value = normalTarget.texture; outlinePass.uniforms.tDepth.value = normalTarget.depthTexture; // ShaderPass clones textures
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.45, 0.5, 0.92));
composer.addPass(new OutputPass());
const gradePass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, res: { value: new THREE.Vector2(1, 1) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time; uniform vec2 res; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; float l = dot(c, vec3(0.299, 0.587, 0.114));
      c = mix(c, c * vec3(0.86, 1.02, 1.04), (1. - l) * 0.4);            // teal shadows
      c = mix(c, c * vec3(1.07, 1.02, 0.9), smoothstep(0.4, 1.0, l) * 0.35); // warm highlights
      c = mix(vec3(l), c, 1.08); c = (c - 0.5) * 1.05 + 0.5;
      float v = smoothstep(1.05, 0.4, length((vUv - 0.5) * vec2(1.15, 1.0))); c *= mix(0.78, 1.0, v);
      c += (h(vUv * res + fract(time) * 91.) - 0.5) * 0.018;
      gl_FragColor = vec4(c, 1.); }`,
});
composer.addPass(gradePass);
let noOutline = null; // only lit (toon) surfaces get outlines; glows, water, mist, particles and sprites are skipped
function renderNormals() {
  if (!noOutline) { noOutline = []; scene.traverse(o => { if ((o.isMesh || o.isPoints || o.isSprite) && !(o.material && o.material.isMeshToonMaterial)) noOutline.push(o); }); }
  const was = noOutline.map(o => o.visible); noOutline.forEach(o => o.visible = false);
  const fog = scene.fog, bg = scene.background; scene.fog = null; scene.background = null; scene.overrideMaterial = normalMat;
  renderer.setRenderTarget(normalTarget); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(scene, camera);
  renderer.setRenderTarget(null); scene.overrideMaterial = null; scene.fog = fog; scene.background = bg;
  noOutline.forEach((o, i) => o.visible = was[i]);
  outlinePass.uniforms.near.value = camera.near; outlinePass.uniforms.far.value = camera.far;
}

function frame() {
  const w = innerWidth, h = innerHeight, pr = renderer.getPixelRatio(); renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h;
  normalTarget.setSize(w * pr, h * pr); outlinePass.uniforms.res.value.set(w * pr, h * pr); gradePass.uniforms.res.value.set(w * pr, h * pr);
  if (VIEW === 'angle') { camera.fov = 40; camera.position.set(-34, 30, 40); camera.lookAt(1, -3, -2); }
  else if (VIEW === 'top') { camera.fov = 40; camera.position.set(0, 78, 0.01); camera.lookAt(0, 0, 0); }
  else { camera.fov = 44; camera.position.set(0, 29, 22.5); camera.lookAt(0, 0, 1.0); }
  camera.updateProjectionMatrix();
}
addEventListener('resize', frame); frame();
const clock = new THREE.Clock();
let lastW = innerWidth, lastH = innerHeight;
renderer.setAnimationLoop(() => { if (innerWidth !== lastW || innerHeight !== lastH) { lastW = innerWidth; lastH = innerHeight; frame(); } // resize events can be missed
  const dt = clock.getDelta(); env.update(clock.elapsedTime, dt, Q.has('quiet')); gradePass.uniforms.time.value = clock.elapsedTime; renderNormals(); composer.render(); });
</script>
</body>
</html>
